services:

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-management-db:
    image: postgres:16
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  account-db:
    image: postgres:16
    environment:
      POSTGRES_DB: accountdb
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: account_pass
    volumes:
      - account-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_user -d accountdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  contact-db:
    image: postgres:16
    environment:
      POSTGRES_DB: contactdb
      POSTGRES_USER: contact_user
      POSTGRES_PASSWORD: contact_pass
    volumes:
      - contact-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contact_user -d contactdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672"
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: AuthService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AuthDbConnection: "Host=auth-db;Port=5432;Database=authdb;Username=auth_user;Password=auth_pass"
      JwtSettings__SecretKey: "${JWT_SECRET}"
      JwtSettings__Issuer: "https://localhost"
      JwtSettings__Audience: "YourAppUsers"
      ServiceUrls__UserManagementService: "http://user-management-service:8080"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "guest"
      RabbitMQ__Password: "guest"
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  user-management-service:
    build:
      context: .
      dockerfile: UserManagementService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__UserManagementDbConnection: "Host=user-management-db;Port=5432;Database=userdb;Username=user_user;Password=user_pass"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "guest"
      RabbitMQ__Password: "guest"
    depends_on:
      user-management-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  account-service:
    build:
      context: .
      dockerfile: AccountService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AccountDbConnection: "Host=account-db;Port=5432;Database=accountdb;Username=account_user;Password=account_pass"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "guest"
      RabbitMQ__Password: "guest"
    depends_on:
      account-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  contact-service:
    build:
      context: .
      dockerfile: ContactService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ContactDbConnection: "Host=contact-db;Port=5432;Database=contactdb;Username=contact_user;Password=contact_pass"
      ServiceUrls__AccountService: "http://account-service:8080"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "guest"
      RabbitMQ__Password: "guest"
    depends_on:
      contact-db:
        condition: service_healthy
      account-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  deal-db:
    image: postgres:16
    environment:
      POSTGRES_DB: dealdb
      POSTGRES_USER: deal_user
      POSTGRES_PASSWORD: deal_pass
    volumes:
      - deal-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deal_user -d dealdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  deal-service:
    build:
      context: .
      dockerfile: DealService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DealDbConnection: "Host=deal-db;Port=5432;Database=dealdb;Username=deal_user;Password=deal_pass"
      ServiceUrls__AccountService: "http://account-service:8080"
      ServiceUrls__ContactService: "http://contact-service:8080"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "guest"
      RabbitMQ__Password: "guest"
    depends_on:
      deal-db:
        condition: service_healthy
      account-service:
        condition: service_started
      contact-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  activity-db:
    image: postgres:16
    environment:
      POSTGRES_DB: activitydb
      POSTGRES_USER: activity_user
      POSTGRES_PASSWORD: activity_pass
    volumes:
      - activity-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activity_user -d activitydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  activity-service:
    build:
      context: .
      dockerfile: ActivityService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ActivityDbConnection: "Host=activity-db;Port=5432;Database=activitydb;Username=activity_user;Password=activity_pass"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "guest"
      RabbitMQ__Password: "guest"
    depends_on:
      activity-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      JwtSettings__SecretKey: "${JWT_SECRET}"
      JwtSettings__Issuer: "https://localhost"
      JwtSettings__Audience: "YourAppUsers"
      AllowedOrigins: "http://localhost:5173"
      ReverseProxy__Clusters__auth-cluster__Destinations__auth-service__Address: "http://auth-service:8080"
      ReverseProxy__Clusters__users-cluster__Destinations__user-management-service__Address: "http://user-management-service:8080"
      ReverseProxy__Clusters__contacts-cluster__Destinations__contact-service__Address: "http://contact-service:8080"
      ReverseProxy__Clusters__accounts-cluster__Destinations__account-service__Address: "http://account-service:8080"
      ReverseProxy__Clusters__deals-cluster__Destinations__deal-service__Address: "http://deal-service:8080"
      ReverseProxy__Clusters__activities-cluster__Destinations__activity-service__Address: "http://activity-service:8080"
    depends_on:
      - auth-service
      - user-management-service
      - account-service
      - contact-service
      - deal-service
      - activity-service
    networks: [backend, frontend]

networks:
  backend:
  frontend:

volumes:
  auth-db-data:
  user-db-data:
  account-db-data:
  contact-db-data:
  deal-db-data:
  activity-db-data:
