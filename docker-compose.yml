services:

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-management-db:
    image: postgres:16
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  account-db:
    image: postgres:16
    environment:
      POSTGRES_DB: accountdb
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD}
    volumes:
      - account-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_user -d accountdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  contact-db:
    image: postgres:16
    environment:
      POSTGRES_DB: contactdb
      POSTGRES_USER: contact_user
      POSTGRES_PASSWORD: ${CONTACT_DB_PASSWORD}
    volumes:
      - contact-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contact_user -d contactdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: AuthService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AuthDbConnection: "Host=auth-db;Port=5432;Database=authdb;Username=auth_user;Password=${AUTH_DB_PASSWORD}"
      JwtSettings__SecretKey: "${JWT_SECRET}"
      JwtSettings__Issuer: "https://localhost"
      JwtSettings__Audience: "YourAppUsers"
      DefaultAdmin__Password: "${DEFAULT_ADMIN_PASSWORD}"
      ServiceUrls__UserManagementService: "http://user-management-service:8080"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USERNAME}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      Seq__Url: "http://seq:80"
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  user-management-service:
    build:
      context: .
      dockerfile: UserManagementService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__UserManagementDbConnection: "Host=user-management-db;Port=5432;Database=userdb;Username=user_user;Password=${USER_DB_PASSWORD}"
      JwtSettings__SecretKey: "${JWT_SECRET}"
      JwtSettings__Issuer: "https://localhost"
      JwtSettings__Audience: "YourAppUsers"
      DefaultAdmin__UserId: "00000000-0000-0000-0000-000000000001"
      DefaultAdmin__Email: "admin@example.com"
      DefaultAdmin__DisplayName: "Default Admin"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USERNAME}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      Seq__Url: "http://seq:80"
    depends_on:
      user-management-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  account-service:
    build:
      context: .
      dockerfile: AccountService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AccountDbConnection: "Host=account-db;Port=5432;Database=accountdb;Username=account_user;Password=${ACCOUNT_DB_PASSWORD}"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USERNAME}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      Seq__Url: "http://seq:80"
    depends_on:
      account-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  contact-service:
    build:
      context: .
      dockerfile: ContactService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ContactDbConnection: "Host=contact-db;Port=5432;Database=contactdb;Username=contact_user;Password=${CONTACT_DB_PASSWORD}"
      ServiceUrls__AccountService: "http://account-service:8080"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USERNAME}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      Seq__Url: "http://seq:80"
    depends_on:
      contact-db:
        condition: service_healthy
      account-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  deal-db:
    image: postgres:16
    environment:
      POSTGRES_DB: dealdb
      POSTGRES_USER: deal_user
      POSTGRES_PASSWORD: ${DEAL_DB_PASSWORD}
    volumes:
      - deal-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deal_user -d dealdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  deal-service:
    build:
      context: .
      dockerfile: DealService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DealDbConnection: "Host=deal-db;Port=5432;Database=dealdb;Username=deal_user;Password=${DEAL_DB_PASSWORD}"
      ServiceUrls__AccountService: "http://account-service:8080"
      ServiceUrls__ContactService: "http://contact-service:8080"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USERNAME}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      Seq__Url: "http://seq:80"
    depends_on:
      deal-db:
        condition: service_healthy
      account-service:
        condition: service_started
      contact-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  activity-db:
    image: postgres:16
    environment:
      POSTGRES_DB: activitydb
      POSTGRES_USER: activity_user
      POSTGRES_PASSWORD: ${ACTIVITY_DB_PASSWORD}
    volumes:
      - activity-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activity_user -d activitydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  activity-service:
    build:
      context: .
      dockerfile: ActivityService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ActivityDbConnection: "Host=activity-db;Port=5432;Database=activitydb;Username=activity_user;Password=${ACTIVITY_DB_PASSWORD}"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USERNAME}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      Seq__Url: "http://seq:80"
    depends_on:
      activity-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  reporting-db:
    image: postgres:16
    environment:
      POSTGRES_DB: reportingdb
      POSTGRES_USER: reporting_user
      POSTGRES_PASSWORD: ${REPORTING_DB_PASSWORD}
    volumes:
      - reporting-db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporting_user -d reportingdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  reporting-service:
    build:
      context: .
      dockerfile: ReportingService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ReportingDbConnection: "Host=reporting-db;Port=5432;Database=reportingdb;Username=reporting_user;Password=${REPORTING_DB_PASSWORD}"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USERNAME}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
      Seq__Url: "http://seq:80"
    depends_on:
      reporting-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [backend]

  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      JwtSettings__SecretKey: "${JWT_SECRET}"
      JwtSettings__Issuer: "https://localhost"
      JwtSettings__Audience: "YourAppUsers"
      AllowedOrigins: "http://localhost:5173"
      Seq__Url: "http://seq:80"
      ReverseProxy__Clusters__auth-cluster__Destinations__auth-service__Address: "http://auth-service:8080"
      ReverseProxy__Clusters__users-cluster__Destinations__user-management-service__Address: "http://user-management-service:8080"
      ReverseProxy__Clusters__contacts-cluster__Destinations__contact-service__Address: "http://contact-service:8080"
      ReverseProxy__Clusters__accounts-cluster__Destinations__account-service__Address: "http://account-service:8080"
      ReverseProxy__Clusters__deals-cluster__Destinations__deal-service__Address: "http://deal-service:8080"
      ReverseProxy__Clusters__activities-cluster__Destinations__activity-service__Address: "http://activity-service:8080"
      ReverseProxy__Clusters__reports-cluster__Destinations__reporting-service__Address: "http://reporting-service:8080"
    depends_on:
      - auth-service
      - user-management-service
      - account-service
      - contact-service
      - deal-service
      - activity-service
      - reporting-service
      - seq
    networks: [backend, frontend]

  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq-data:/data
    networks: [backend, frontend]

networks:
  backend:
  frontend:

volumes:
  auth-db-data:
  user-db-data:
  account-db-data:
  contact-db-data:
  deal-db-data:
  activity-db-data:
  reporting-db-data:
  seq-data:
