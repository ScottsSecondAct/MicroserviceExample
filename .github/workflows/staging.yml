name: Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build and run unit + integration tests
  # ---------------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore MicroserviceExample.sln

      - name: Build
        run: dotnet build MicroserviceExample.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test MicroserviceExample.sln --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~EndToEnd"

  # ---------------------------------------------------------------------------
  # End-to-end tests against the live Docker Compose stack
  # Runs only after the build/test job passes.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Clear Docker BuildKit NuGet cache
        run: docker builder prune --filter type=exec.cachemount --force

      - name: Run E2E suite
        run: |
          chmod +x scripts/run-e2e.sh
          ./scripts/run-e2e.sh
