name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0, v1.1.0, etc.

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Create GitHub Release
  # The commit reaching a v* tag has already passed CI (feature branch) and
  # Staging (merge to main, including E2E). No need to re-run tests here.
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
